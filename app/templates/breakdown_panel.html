<section id="breakdown-workspace" hidden>
<p class="muted">依据当前状态，把目标拆成容易开始的小动作。生成会把当前目标、必要关联信息和反馈发送到灵石区模型。</p>
<label>拆解历史<select id="breakdown-history"><option value="">尚无方案</option></select></label><button type="button" class="button secondary" id="breakdown-more" hidden>更早的方案</button>
<p id="breakdown-message" role="status"></p><p id="breakdown-reply"></p><p id="breakdown-state"></p><div id="breakdown-advice"></div>
<p id="breakdown-minimum" class="breakdown-minimum" hidden></p><div id="breakdown-editor"></div>
<button type="button" class="button secondary" id="breakdown-edit" hidden>保存草稿修改</button>
<div id="breakdown-save" class="form-stack" hidden><label>保存方式<select id="breakdown-mode"></select></label><label class="check-label"><input type="checkbox" id="breakdown-duplicates"> 我已核对已有内容，允许创建相似步骤</label><button class="button primary" id="breakdown-confirm" type="button">确认保存所选步骤</button></div>
<div id="breakdown-execution" hidden><label>在已有副本中执行（主线可选）<select id="breakdown-existing"><option value="">按所选方案执行</option></select></label><button type="button" class="button primary" id="breakdown-start">进入专注</button><p class="muted">清单勾选只记录辅助步骤，不改变副本完成状态、经验或金币。进入专注后仍需点击开始计时。</p></div>
<form id="breakdown-feedback-form" class="form-stack"><label>告诉我怎样更容易开始<textarea id="breakdown-feedback" maxlength="2000" placeholder="第一步还是太难；我今天只有十分钟……"></textarea></label><button class="button primary" id="breakdown-generate" type="submit">生成拆解方案</button></form>
<button type="button" class="button secondary" id="breakdown-reload">重新读取方案</button><button type="button" class="button secondary" id="breakdown-state-toggle">切换状态对话</button>
</section>
<script src="{{ url_for('static',path='js/breakdown.js') }}" defer></script>
