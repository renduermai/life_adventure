<script src="{{ url_for('static',path='js/memory_media.js') }}" defer></script>
<script src="{{ url_for('static',path='js/memory_items.js') }}" defer></script>
<section class="card memory-panel"><div class="memory-toolbar"><h2>武器工坊</h2><button class="button primary" id="item-new" type="button">＋ 添加物品</button><button class="button secondary" id="item-refresh" type="button">整理分析</button></div><p class="muted">日均价格是平均持有成本；颜色仅表示当前筛选结果中的相对水平。整理分析在本地计算，不调用 AI。</p><label>类别筛选 <select id="item-filter"><option value="">全部</option></select></label><p id="item-message" role="status" aria-live="polite"></p><div id="item-list" class="item-grid"><p class="muted">正在读取…</p></div><button class="button secondary" id="item-more" hidden>加载更多</button></section>
<section class="card memory-panel" id="item-editor" hidden><h3 id="item-editor-title">添加物品</h3><form id="item-form" class="form-stack">
<label>物品名称<input name="name" maxlength="120" required></label><label>购买日期<input name="purchase_date" type="date" required></label><label>购买价格（人民币）<input name="purchase_price" type="number" min="0" max="999999999999.99" step="0.01" required></label><label>分类（可自行填写）<input name="category" maxlength="120" list="item-categories"></label><datalist id="item-categories"><option value="电子产品"><option value="兴趣课程"><option value="运动健身"><option value="其他"></datalist>
<label><input name="is_entitlement" type="checkbox"> 是否权益类资产</label>
<label id="item-expiry-field" hidden>到期日期<input name="expires_at" type="date" disabled></label>
<label>图片（可选）<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="muted">图片上传到私有云，最大 5MB；不选择图片也可保存。</p><label><input type="checkbox" name="remove_image"> 移除已有图片</label><img id="item-preview" alt="图片预览" hidden><p id="item-form-message" role="status"></p><div><button type="submit" class="button primary">保存物品</button><button type="button" class="button secondary" id="item-cancel">取消</button></div></form></section>
