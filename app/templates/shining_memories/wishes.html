<script src="{{ url_for('static',path='js/memory_media.js') }}" defer></script>
<script src="{{ url_for('static',path='js/memory_wishes.js') }}" defer></script>
<section class="card memory-panel"><div class="memory-toolbar"><h2>心愿单</h2><button id="wish-new" class="button primary" type="button">＋ 新增心愿</button><button id="wish-reload" class="button secondary" type="button">重新读取</button></div><p class="muted">价格是你最后填写的估计，不是已验证的实时市场价格。</p><label>类别筛选<select id="wish-filter"><option value="">全部</option></select></label><p id="wish-message" role="status"></p><div id="wish-list" class="item-grid"><p class="muted">正在读取…</p></div><button id="wish-more" class="button secondary" hidden>加载更多</button></section>
<section id="wish-editor" class="card memory-panel" hidden><h3 id="wish-title">新增心愿</h3><form id="wish-form" class="form-stack"><label>心愿名称<input name="name" maxlength="120" required></label><label>心愿描述<textarea name="description" maxlength="5000" rows="3"></textarea></label><label>想拥有它的原因<textarea name="reason" maxlength="2000" rows="3"></textarea></label><label id="wish-initial-label">当前估计价格（人民币）<input name="price" type="number" min="0" max="999999999999.99" step="0.01" required></label><label>类别<input name="category" maxlength="120"></label><label>图片（可选）<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label><input name="remove_image" type="checkbox"> 移除已有图片</label><img id="wish-preview" alt="心愿图片预览" hidden><p id="wish-form-message" role="status"></p><div><button type="submit" class="button primary">保存心愿</button><button id="wish-cancel" type="button" class="button secondary">取消</button></div></form></section>
<section id="wish-detail" class="card memory-panel" hidden><h3 id="wish-detail-title"></h3><p id="wish-story" class="memory-original"></p><h4>价格历史</h4><div id="wish-prices"></div><button id="wish-prices-more" class="button secondary" hidden>更多价格记录</button><h4>更新手动估价</h4><form id="wish-price-form" class="form-stack"><label>价格（人民币）<input name="price" type="number" min="0" step="0.01" max="999999999999.99" required></label><label><input name="correct" type="checkbox"> 这是纠正首次录入错误</label><label>纠正原因（纠正首次价格时必填）<input name="note" maxlength="500"></label><p class="muted">纠正会保留旧值和原因；已有后续估价时，不改变最新估价。</p><p id="wish-price-message" role="status"></p><button class="button primary" type="submit">保存价格</button></form></section>
